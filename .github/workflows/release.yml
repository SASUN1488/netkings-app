# Builds: sing-box core + Flutter app for Android, Windows and Linux.
# Push a tag vX.Y.Z -> files are attached to that GitHub release; "Run workflow" -> artifacts only (for testing).
# Android is signed with the release key from the repository secrets (ANDROID_*).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.8"
  SING_BOX_VERSION: "1.14.4"
  SING_BOX_TAGS: with_gvisor,with_quic,with_utls,with_clash_api

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v${{ env.SING_BOX_VERSION }}
          path: sing-box
      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum
      - name: Build sing-box (linux, windows)
        working-directory: sing-box
        run: |
          L="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=$SING_BOX_VERSION"
          CGO_ENABLED=0 go build -trimpath -ldflags "$L" -tags "$SING_BOX_TAGS" -o ../out/linux/sing-box ./cmd/sing-box
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$L" -tags "$SING_BOX_TAGS" -o ../out/windows/sing-box.exe ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: out/

  windows:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: core
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          New-Item -ItemType Directory dist/NetKings | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* dist/NetKings/
          if (-not (Test-Path dist/NetKings/core/sing-box.exe)) { throw "core missing in bundle" }
          Compress-Archive -Path dist/NetKings -DestinationPath "dist/NetKings-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core
          path: core
      - name: Desktop build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          chmod +x core/linux/sing-box
          flutter build linux --release
      - name: Package
        run: |
          v=$(sed -nE 's/^version:\s*([^+ ]+).*/\1/p' pubspec.yaml)
          mkdir -p dist/netkings-linux
          cp -a build/linux/x64/release/bundle dist/netkings-linux/
          test -x dist/netkings-linux/bundle/lib/core/sing-box
          cp packaging/install-linux.sh packaging/netkings.png dist/netkings-linux/
          tar -C dist -czf "dist/NetKings-$v-linux-x64.tar.gz" netkings-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v${{ env.SING_BOX_VERSION }}
          path: sing-box
      - uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: libbox.aar (gomobile)
        working-directory: sing-box
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12 github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          mkdir -p ../android/app/libs
          gomobile bind -target android/arm64,android/arm -androidapi 23 -javapkg=io.nekohasekai -libname=box \
            -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$SING_BOX_VERSION -s -w -buildid= -checklinkname=0" \
            -tags "$SING_BOX_TAGS,badlinkname,tfogo_checklinkname0" -o ../android/app/libs/libbox.aar ./experimental/libbox
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" "$RUNNER_TEMP/release.jks" > "$RUNNER_TEMP/key.properties"
          echo "NK_KEY_PROPERTIES=$RUNNER_TEMP/key.properties" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm
      - name: Package
        run: |
          v=$(sed -nE 's/^version:\s*([^+ ]+).*/\1/p' pubspec.yaml)
          o=build/app/outputs/flutter-apk
          mkdir -p dist
          cp $o/app-arm64-v8a-release.apk "dist/NetKings-$v-android-arm64.apk"
          cp $o/app-armeabi-v7a-release.apk "dist/NetKings-$v-android-armv7.apk"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/key.properties"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{android,windows,linux}"
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "NetKings ${tag#v}" --notes "Desktop builds by GitHub Actions."
          gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
